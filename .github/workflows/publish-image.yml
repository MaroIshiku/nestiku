name: Publish Container Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/maroishiku/nestiku
  DOCKER_METADATA_SHORT_SHA_LENGTH: 12

jobs:
  verify:
    uses: ./.github/workflows/ishiku-pull-request-verify.yml
    with:
      require_all_verified: true

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-

      - name: Resolve reproducible build metadata
        id: build-meta
        run: |
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NESTIKU_BUILD_DATE=${{ steps.build-meta.outputs.date }}
            NESTIKU_GIT_SHA=${{ steps.build-meta.outputs.sha }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test the published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          container="nestiku-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -p 127.0.0.1::8080 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          port="$(docker port "$container" 8080/tcp | sed 's/.*://')"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/readyz" >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec "$container" awk '/^Uid:/{print $2}' /proc/1/status)" = "10001"

      - name: Promote the tested digest to main and latest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:main" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$latest_digest" = "$IMAGE_DIGEST"
