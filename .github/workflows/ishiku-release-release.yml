name: ishiku release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/maroishiku/nestiku

jobs:
  verify:
    uses: ./.github/workflows/ishiku-pull-request-verify.yml
    with:
      require_all_verified: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Promote the verified main image without rebuilding
        id: promote
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_tag="sha-${SOURCE_SHA:0:12}"
          source_image="${IMAGE_NAME}:${source_tag}"
          target_image="${IMAGE_NAME}:${RELEASE_TAG}"
          if docker buildx imagetools inspect "$target_image" >/dev/null 2>&1; then
            echo "Release image already exists: $target_image" >&2
            exit 1
          fi
          source_digest="$(docker buildx imagetools inspect "$source_image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          docker buildx imagetools create --tag "$target_image" "${source_image}@${source_digest}"
          target_digest="$(docker buildx imagetools inspect "$target_image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$source_digest" = "$target_digest"
          echo "digest=$target_digest" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Container image

          - Image: \`${IMAGE_NAME}:${GITHUB_REF_NAME}\`
          - Digest: \`${IMAGE_DIGEST}\`
          - Platforms: \`linux/amd64\`, \`linux/arm64\`
          - Verification: the release tag promotes the already verified main-branch digest without rebuilding.
          - Data compatibility: existing Nestiku JSON data remains compatible; no migration is required.
          - Rollback: deploy the preceding immutable version tag and keep the existing \`/data\` mount.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Nestiku ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/release-notes.md"
